# Desktop release pipeline — triggered by tags like v0.6.1 (unified single tag).
# Builds the Wails GUI (EXE) and the NSIS installer, asserts the PE
# subsystem is windowsgui (no console window), and publishes both to a
# GitHub Release. Both pipelines upload assets to the same Release.
name: release-desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Ensure NSIS (windows runners preinstall it; install if absent)
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          # choco deploy puts makensis outside the current PATH; refresh it
          # for this step AND all later steps (wails build -nsis needs it).
          $nsis = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS",
                    "$env:ProgramData\chocolatey\lib\nsis\tools\nsis\Bin") |
                  Where-Object { Test-Path (Join-Path $_ 'makensis.exe') } |
                  Select-Object -First 1
          if (-not $nsis) { throw 'makensis.exe not found after install' }
          Add-Content $env:GITHUB_PATH $nsis
          $env:PATH = "$nsis;$env:PATH"
          makensis /VERSION

      - name: Build EXE + NSIS installer
        working-directory: desktop
        run: wails build -nsis -ldflags "-s -w"

      - name: Assert PE subsystem is windowsgui (no console window)
        run: |
          python -c @"
          import struct
          for fn in ['desktop/build/bin/localoctop.exe',
                     'desktop/build/bin/localoctop-desktop-amd64-installer.exe']:
              with open(fn,'rb') as f:
                  assert f.read(2)==b'MZ', fn
                  f.seek(0x3C); e=struct.unpack('<I',f.read(4))[0]
                  f.seek(e+24+68)
                  sub=struct.unpack('<H',f.read(2))[0]
              print(fn, 'subsystem =', sub)
              assert sub==2, 'console subsystem leaked: '+fn
          print('PE subsystem windowsgui asserted for EXE and installer')
          "@

      - name: Package portable zip (EXE + README)
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/README.md desktop/build/bin/
          Compress-Archive -Path desktop/build/bin/localoctop.exe,desktop/build/bin/README.md `
            -DestinationPath "dist/localoctop-$tag-windows-amd64.zip" -Force

      - name: sha256 checksums
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/build/bin/localoctop-desktop-amd64-installer.exe `
            "dist/localoctop-$tag-setup.exe"
          Get-ChildItem dist/* | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          } | Set-Content "dist/checksums-sha256.txt"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/localoctop-*-windows-amd64.zip
            dist/localoctop-*-setup.exe
            dist/checksums-sha256.txt
          generate_release_notes: true
