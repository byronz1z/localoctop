name: Release

# Tag pushes (v*) build the single EXE on GitHub's official CI and publish a
# GitHub Release with two assets:
#
#   1. octop-local-bridge-<tag>-windows-amd64.zip
#        bridge.exe + examples/ (Octop connector template + 3-step guide)
#        — the out-of-the-box desktop package.
#   2. mcp-localfs-adapter-<tag>.zip
#        the adapter/ source tree — server-side deployment bundle.
#
# Local builds are self-test evidence only — they are never a deliverable.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Compile single EXE
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-s -w" -o dist/bridge.exe ./cmd/bridge

      - name: Package main zip (bridge.exe + examples)
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist/pkg/examples | Out-Null
          Copy-Item dist/bridge.exe dist/pkg/bridge.exe
          Copy-Item examples/* dist/pkg/examples/ -Recurse
          Compress-Archive -Path dist/pkg/* -DestinationPath "dist/octop-local-bridge-$tag-windows-amd64.zip"

      - name: Package adapter zip
        run: |
          $tag = "${{ github.ref_name }}"
          # Clean CI checkout has no runtime artifacts under adapter/ (all gitignored),
          # so zip the tracked directory directly; -Force keeps re-runs idempotent.
          Compress-Archive -Path adapter -DestinationPath "dist/mcp-localfs-adapter-$tag.zip" -Force

      - name: sha256 checksums
        run: |
          $tag = "${{ github.ref_name }}"
          foreach ($zip in @("octop-local-bridge-$tag-windows-amd64.zip", "mcp-localfs-adapter-$tag.zip")) {
            $h = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "dist/$zip.sha256" -Value "$h  $zip" -NoNewline
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
