# Append this service to the existing Octop docker-compose stack.
# The localoctop adapter runs as its own container — it never enters the octop image.
services:
  localoctop-server:
    build: .
    image: localoctop-server:1.0.0
    restart: unless-stopped
    environment:
      # MCP tokens (Octop connector Bearer) — "userA:tokA,userB:tokB".
      LOCALOCTOP_MCP_TOKENS: ${LOCALOCTOP_MCP_TOKENS:-}
      # Bridge tokens (client WSS dial-in) — "userA:btokA". When unset,
      # LOCALOCTOP_MCP_TOKENS seeds both directions (single-token back-compat).
      LOCALOCTOP_CLIENT_TOKENS: ${LOCALOCTOP_CLIENT_TOKENS:-}
      # Mint tokens at runtime instead: POST /admin/tokens/issue with
      # {"user_id": "...", "kind": "mcp"|"bridge"} (loopback or LOCALOCTOP_ADMIN_TOKEN).
      # Staged rollout: read-only for everyone first; enable per-user later.
      LOCALOCTOP_ALLOW_WRITE: "false"
      LOCALOCTOP_WRITE_ALLOWLIST: ${LOCALOCTOP_WRITE_ALLOWLIST:-}
      # Admin kill-switch (product layer): set "true" to disable all calls.
      LOCALOCTOP_DISABLED: "false"
      LOCALOCTOP_AUDIT_LOG: /app/logs/calls.jsonl
      LOCALOCTOP_LOG_LEVEL: INFO
    volumes:
      - localoctop-audit:/app/logs
    networks:
      - octop-net
    # Bind to loopback only when a reverse proxy (Caddy/Nginx/Traefik) fronts
    # the container and terminates TLS for wss:// and https://.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  localoctop-audit:

networks:
  octop-net:
    external: true
